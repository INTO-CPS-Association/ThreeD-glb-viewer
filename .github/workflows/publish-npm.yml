name: Publish package to Github NPM

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: "packages/pkg-threejs-custom"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install
      - run: bun run build
      - run: bun publish --registry "https://npm.pkg.github.com"
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
